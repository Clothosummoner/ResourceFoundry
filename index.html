<!DOCTYPE html>
<html lang="de">
<head>
    <link href="style.css" rel="stylesheet" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Foundry</title>
</head>
<body>
    <h1>Resource Foundry</h1>
    <p>Dein eigenes Ressourcen-Imperium beginnt hier.</p>
    <div class="top-bar">
        <button id="nav-resources">Ressourcen</button>
        <button id="nav-shop">Shop</button>
        <button id="save-game">Spiel speichern</button>
        <button id="reset-game">Spiel zurücksetzen</button>
        <div class="sellamountbuttons">
            <div class="slider" id="amount-slider"></div>
            <button id="amount-1">1</button>
            <button id="amount-10">10</button>
            <button id="amount-100">100</button>
            <button id="amount-max">Max</button>
        </div>
    </div>
   
    <div class="resource-view" id="resource-view">
        <p>Ressourcen</p>

        <div class="resource-grid">

            <div class="resource-card">
                <p class="resource-name">Geld</p>
                <p class="resource-amountM" id="money-amount">0</p>
            </div>
            <div class="resource-card">
                <p class="resource-name">Holz</p>
                <p class="resource-amount" id="wood-amount">0</p>
                <button id="collect-wood">Holz sammeln</button>
                <button id="sell-wood">Holz verkaufen (1 Geld)</button>
            </div>
            <div class="resource-card">
                <div class="stoneLocked" id="stoneLocked">
                    <p class="resource-name">Stein</p>
                    <button id="unlock-stone">Stein freischalten (500 Holz)</button>
                </div>
                <div class="stoneUnlocked" id="stoneUnlocked">
                    <p class="resource-name">Stein</p>
                    <p class="resource-amount" id="stone-amount">0</p>
                    <button id="collect-stone">Stein sammeln</button>
                    <button id="sell-stone">Stein verkaufen (2 Geld)</button>
                </div>
            
            </div>
            <div class="resource-card">
                <div class="sandLocked" id="sandLocked">
                    <p class="resource-name">Sand</p>
                    <button id="unlock-sand">Sand freischalten (1000 Stein)</button>
                </div>
                <div class="sandUnlocked" id="sandUnlocked">
                    <p class="resource-name">Sand</p>
                    <p class="resource-amount" id="sand-amount">0</p>
                    <button id="collect-sand">Sand sammeln</button>
                    <button id="sell-sand">Sand verkaufen (3 Geld)</button>
                </div>
            </div>
        </div>
    </div>
    <div class="shop-view" id="shop-view">
        <h2>Shop</h2>
        <p>Willkommen im Shop!</p>
        <div class="resource-card" data-requires="wood">
            <p class="resource-name">Holzfäller</p>
            <p class="resource-amount" id="lumberjack-amount">0</p>
            <button id="buy-lumberjack">Holzfäller kaufen (<span id="lumberjack-cost">10</span> Geld)</button>
        </div>
        <div class="resource-card" data-requires="stone">
            <p class="resource-name">Steinmetz</p>
            <p class="resource-amount" id="quarry-worker-amount">0</p>
            <button id="buy-quarry-worker">Steinmetz kaufen (<span id="quarry-worker-cost">20</span> Geld)</button>
        </div>
        <div class="resource-card" data-requires="sand">
            <p class="resource-name">Sandmann</p>
            <p class="resource-amount" id="sand-worker-amount">0</p>
            <button id="buy-sand-worker">Sandmann kaufen (<span id="sand-worker-cost">30</span> Geld)</button>
        </div>
        <div class="resource-card" data-requires="wood">
            <p class="resource-name">Axt</p>
            <p class="resource-amount" id="axe-amount">Nicht gekauft</p>
            <button id="buy-axe">Axt kaufen (500 Geld)</button>
        </div>

        <div class="resource-card" data-requires="stone">
            <p class="resource-name">Spitzhacke</p>
            <p class="resource-amount" id="pickaxe-amount">Nicht gekauft</p>
            <button id="buy-pickaxe">Spitzhacke kaufen (1000 Geld)</button>
        </div>
        <div class="resource-card" data-requires="sand">
            <p class="resource-name">Schaufel</p>
            <p class="resource-amount" id="shovel-amount">Nicht gekauft</p>
            <button id="buy-shovel">Schaufel kaufen (2000 Geld)</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
